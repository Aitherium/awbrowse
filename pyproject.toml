[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "awbrowse"
version = "0.1.0"
description = "A portable client for AitherBrowser-shaped page rendering — browse, scrape and drive a real browser from an agent, over a service you host."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
awbrowse = "awbrowse.cli:main"

[project.urls]
Homepage = "https://github.com/Aitherium/awbrowse"
Documentation = "https://github.com/Aitherium/awbrowse#readme"
Repository = "https://github.com/Aitherium/awbrowse.git"
Issues = "https://github.com/Aitherium/awbrowse/issues"

[tool.setuptools]
packages = ["awbrowse"]
license-files = ["LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "E402", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
